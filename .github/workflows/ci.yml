name: CI

on:
  push:
    branches: [ main, oss, revamp ]
  pull_request:
    branches: [ main, oss, revamp ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      # After PR4-a, heavy deps (fastapi, splink, neo4j, redis, etc.)
      # live behind extras. CI exercises the full test surface, so pull
      # all extras and the dev group. Base-only install is separately
      # smoke-tested below.
      - name: Sync dependencies (all extras + dev)
        run: uv sync --all-extras --group dev

      - name: Lint
        run: make lint

      - name: Type check (temporary allow-fail)
        run: make typecheck
        continue-on-error: true

      - name: Run tests
        run: make test

      - name: Dead code scan
        run: make deadcode

      # Smoke test: fresh venv with base install only must succeed,
      # the package must import, and the console script must be
      # registered. Catches regressions that break
      # `pip install graphora-server` for users who don't need the
      # full server runtime (e.g. future MCP-only consumers).
      - name: Base install smoke test
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install --quiet --upgrade pip
          /tmp/base/bin/pip install --quiet .
          /tmp/base/bin/python -c "import graphora_server; print('ok base import')"
          /tmp/base/bin/graphora-server --help > /dev/null
          echo "ok console script registered"

      # Smoke test: [server] extra must be self-contained enough to
      # import graphora_server.main:app without ModuleNotFoundError.
      # This catches the exact regression from the PR4-a review:
      # `serve --help` passing while a real `serve` blows up on
      # eager imports of psycopg / neo4j / pypdf in the app chain.
      - name: Server extra import smoke test
        run: |
          python -m venv /tmp/server
          /tmp/server/bin/pip install --quiet --upgrade pip
          /tmp/server/bin/pip install --quiet '.[server]'
          /tmp/server/bin/python -c "from graphora_server.main import app; print('ok main.app imports with [server] only')"

      # Smoke test: wheel build produces all subpackage modules plus
      # the .baml and ontology yaml assets. Catches the
      # packages.find regression pattern that bit us in PR2 review.
      - name: Wheel build smoke test
        run: |
          uv run --with build python -m build --wheel --outdir /tmp/wheel
          WHEEL=$(ls /tmp/wheel/*.whl)
          PY_COUNT=$(unzip -l "$WHEEL" | grep -c 'graphora_server.*\.py$')
          BAML_COUNT=$(unzip -l "$WHEEL" | grep -c '\.baml$')
          YAML_COUNT=$(unzip -l "$WHEEL" | grep -c 'templates.*\.yaml$')
          echo "python modules: $PY_COUNT  baml: $BAML_COUNT  yaml: $YAML_COUNT"
          if [ "$PY_COUNT" -lt 100 ]; then
            echo "::error::wheel has fewer than 100 python modules; packages.find misconfigured?"
            exit 1
          fi
          if [ "$BAML_COUNT" -lt 10 ]; then
            echo "::error::wheel missing baml assets; package-data misconfigured?"
            exit 1
          fi
          if [ "$YAML_COUNT" -lt 5 ]; then
            echo "::error::wheel missing ontology templates; package-data misconfigured?"
            exit 1
          fi
