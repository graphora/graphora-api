[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_cli = True
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = -v 
markers =
    integration: tests that exercise FastAPI endpoints or real service wiring
