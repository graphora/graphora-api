[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_cli = True
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
# --ignore=tests/e2e keeps the provider E2E harness out of `make test`.
# That harness requires live API keys and runs only via
# .github/workflows/provider-e2e.yml, which invokes pytest on the
# explicit tests/e2e/providers path so --ignore doesn't apply.
addopts = -v --cov=graphora_server --cov-report=term-missing:skip-covered --cov-report=xml --ignore=tests/e2e
markers =
    integration: tests that exercise FastAPI endpoints or real service wiring
    e2e_provider: provider-specific end-to-end test (requires live API keys)
