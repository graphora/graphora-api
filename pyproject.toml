[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graphora-server"
version = "0.1.0"
description = "Graphora server: the extraction pipeline and HTTP API behind the Graphora CLI + MCP client"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "instructor>=1.7.0",
    "instructor[vertexai]>=1.7.0",
    "openai>=1.52.0",
    "langchain-experimental>=0.3.4",
    "langchain-huggingface>=0.1.2",
    "sentence-transformers>=3.4.1",
    "psutil>=5.9.8",
    "neo4j>=5.27.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "google-cloud-aiplatform>=1.43.0",
    "vertexai>=0.0.1",
    "prefect>=3.2.7",
    "pyyaml>=6.0.1",
    "uvicorn>=0.27.1",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "python-dotenv>=1.0.1",
    "pypdf>=4.0.0",
    "PyJWT[crypto]>=2.9.0",
    "cryptography>=42.0.0",
    "pydantic>=2.6.1",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "splink==4.0.7",
    "anthropic[vertex]>=0.43.1",
    "google-genai>=1.2.0",
    "aiofiles>=23.2.1",
    "redis>=5.0.11",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "baml-py==0.89.0",
]

[project.scripts]
graphora-server = "graphora_server.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "vulture>=2.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "sqlparse>=0.5.1",
]

[tool.setuptools.packages.find]
include = ["graphora_server*"]
exclude = ["tests*", "scripts*", "migrations*", "docs*", "prototyping*"]

[tool.setuptools.package-data]
graphora_server = [
    "baml_src/*.baml",
    "templates/ontologies/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "prototyping",
    "node_modules",
    "migrations",
]
