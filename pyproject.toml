[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graphora-server"
version = "0.1.0"
description = "Graphora server: the extraction pipeline and HTTP API behind the Graphora CLI + MCP client"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Foundational — always installed.
    "baml-py==0.89.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "aiofiles>=23.2.1",
    # MIME validation. The Python package is tiny, but the underlying
    # libmagic1 C library is opt-in; validators.py falls back to
    # mimetypes gracefully when python-magic or libmagic is missing.
    "python-magic>=0.4.27",
    # LLM providers: only google-genai and openai stay in base today.
    # google-genai is the active BAML path (utils/baml_helper.py only
    # constructs google-ai clients) and graphora_server.services.llm.client
    # imports from google.genai directly. openai is still here because
    # the ai_config_service references the provider by string and we
    # haven't yet proved no fallback path touches the SDK — a future
    # pass with the provider E2E harness gating will move it to
    # [openai] alongside a test_openai.py that exercises BAML.
    #
    # Removed from base (no Python imports, no BAML client):
    #   anthropic[vertex]       → now only in [anthropic]
    #   instructor              → dead (BAML replaces it)
    #   instructor[vertexai]    → dead
    #
    # Still in base pending a paired BAML-cleanup pass:
    #   vertexai                → clients.baml declares a legacy
    #                             VertexAI client; removing the SDK
    #                             without removing the BAML client
    #                             would break anyone who flips the
    #                             client_registry.set_primary switch.
    #   google-cloud-aiplatform → transitive of vertexai
    "openai>=1.52.0",
    "google-genai>=1.2.0",
    "google-cloud-aiplatform>=1.43.0",
    "vertexai>=0.0.1",
]

[project.optional-dependencies]
# HTTP server runtime. Required to run `graphora-server serve`.
#
# Contract: `pip install graphora-server[server]` is sufficient to
# import graphora_server.main:app and start the uvicorn process.
# Because the app eagerly imports psycopg (audit, usage, ai_config,
# entity_ledger, schema_storage, feedback, and merge repositories
# all persist to Postgres), neo4j (api/config.py for credential
# management + storage module), and pypdf (flows.py for page
# counting), those three extras are folded into [server] rather
# than refactored to lazy imports. The result is a honest "[server]
# is enough to serve" contract.
server = [
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prefect>=3.2.7",
    "psutil>=5.9.8",
    "PyJWT[crypto]>=2.9.0",
    "cryptography>=42.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    # Transitive extras required to import graphora_server.main:
    "graphora-server[pdf,neo4j,postgres]",
]
# Semantic chunking.
chunking = [
    "langchain-experimental>=0.3.4",
    "langchain-text-splitters>=0.3.0",
]
# Local embeddings via HuggingFace. Pulls torch; heavy.
embeddings = [
    "sentence-transformers>=3.4.1",
    "langchain-huggingface>=0.1.2",
]
# Entity resolution pipeline (Splink + DuckDB). Heavy.
er = [
    "splink==4.0.7",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
]
# PDF parsing.
#
# pypdf is the default lightweight backend (tiny, pure-Python).
# pymupdf (AGPL / commercial) is added as the preferred layout-aware
# extractor — the parser tries it first and falls back to pypdf when
# pymupdf isn't installed. Both are ~small enough to include together
# in [pdf]; the parser handles either alone.
pdf = [
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
]

# Office / "broad document" parsing via Microsoft's MarkItDown.
# Covers docx/xlsx/pptx/epub/rtf/odt and normalizes everything to
# Markdown — matches the README's "Word docs" promise.
docling = [
    "markitdown[docx,xlsx,pptx]>=0.1.0",
]

# URL content extraction for "give me the text of this article".
# trafilatura handles boilerplate removal and is the cheapest /
# most-accurate open-source option we tested. Only installed when
# the URL path is needed.
url = [
    "trafilatura>=1.12.0",
]
# Graph backends.
neo4j = [
    "neo4j>=5.27.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
]
# Kuzu: embedded graph DB for [local] mode. Declared as its own extra
# so the client-side [local] meta-extra can depend on graphora-server
# [kuzu] transitively once graphora-server is published to PyPI.
# The storage/factory dispatch to Kuzu is not wired yet (Gate 5 work);
# for now this extra installs the driver only.
kuzu = [
    "kuzu>=0.6.0",
]
# Cache / progress backend.
redis = [
    "redis>=5.0.11",
]
# Ollama client. When this is installed AND Ollama is reachable on
# localhost:11434, the server can route to a local model instead of
# a cloud LLM. Server-side BAML Ollama provider wiring is upstream
# work (tracked in the Gate 2 "no-key local" exit criterion).
ollama = [
    "ollama>=0.4.0",
]

# Per-provider LLM extras. Parallel to graphora-client's [openai] /
# [anthropic] / [gemini] naming.
#
# The underlying SDK packages are ALSO still in base dependencies
# today: BAML may dynamically import provider clients at runtime
# based on config, and `rg` can't see those imports. Once PR1c's
# provider E2E harness lands, we move these packages out of base
# one-at-a-time (each gated by the harness) so the provider extras
# become the only place they're declared. Until then, installing
# `graphora-server[openai]` is a no-op beyond making the intent
# explicit — openai is already installed via base.
openai = [
    "openai>=1.52.0",
]
anthropic = [
    "anthropic[vertex]>=0.43.1",
]
gemini = [
    "google-genai>=1.2.0",
]
vertexai = [
    "vertexai>=0.0.1",
    "google-cloud-aiplatform>=1.43.0",
]

# Convenience union. Use this for a runnable server with all features.
all = [
    "graphora-server[server,chunking,embeddings,er,pdf,docling,url,neo4j,postgres,kuzu,redis,ollama,openai,anthropic,gemini,vertexai]",
]

# Developer tooling. Named `dev` to mirror the locked taxonomy; kept
# as a [project.optional-dependencies] entry (pip-installable) rather
# than a [dependency-groups] entry (uv-only) so contributors using
# pip/poetry/hatch can also access it via `pip install -e '.[dev]'`.
# The [dependency-groups] dev block below is kept in sync as uv's
# preferred shape.
dev = [
    "ruff>=0.7.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "vulture>=2.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "sqlparse>=0.5.1",
]

[project.scripts]
graphora-server = "graphora_server.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "vulture>=2.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "sqlparse>=0.5.1",
]

[tool.setuptools.packages.find]
include = ["graphora_server*"]
exclude = ["tests*", "scripts*", "migrations*", "docs*", "prototyping*"]

[tool.setuptools.package-data]
graphora_server = [
    "baml_src/*.baml",
    "templates/ontologies/*.yaml",
]

# Pytest config lives in pytest.ini (single source of truth — pytest
# prefers pytest.ini over pyproject.toml when both are present).
# Provider E2E excludes, coverage package, and markers are declared
# there.

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "prototyping",
    "node_modules",
    "migrations",
]
