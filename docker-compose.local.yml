services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphora-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphora
      POSTGRES_PASSWORD: graphora
      POSTGRES_DB: graphora
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphora -d graphora"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-staging:
    image: neo4j:5.20
    container_name: graphora-neo4j-staging-local
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-staging-data:/data
      - neo4j-staging-logs:/logs
      - neo4j-staging-import:/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  neo4j-prod:
    image: neo4j:5.20
    container_name: graphora-neo4j-prod-local
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    ports:
      - "8474:7474"
      - "8687:7687"
    volumes:
      - neo4j-prod-data:/data
      - neo4j-prod-logs:/logs
      - neo4j-prod-import:/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: graphora-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  prefect:
    image: prefecthq/prefect:3.2.7-python3.11
    container_name: graphora-prefect-local
    restart: unless-stopped
    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4200"
    environment:
      PREFECT_API_URL: http://0.0.0.0:4200/api
    ports:
      - "4200:4200"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4200/api/health")'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  neo4j-staging-data:
  neo4j-staging-logs:
  neo4j-staging-import:
  neo4j-prod-data:
  neo4j-prod-logs:
  neo4j-prod-import:
  redis-data:
