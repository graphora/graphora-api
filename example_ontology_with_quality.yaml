# Example ontology with quality rules for testing
version: 1.0.0
entities:
  Company:
    properties:
      description:
        type: string
        description: Description about the company
        quality:
          format:
            minLength: 10
            maxLength: 500
          business:
            forbiddenValues: ["Unknown", "N/A", "TBD", ""]
      
      companyId:
        type: string
        description: A primary unique identifier for the company.
        unique: true
        quality:
          format:
            pattern: "^[A-Z0-9-]{2,20}$"
            examples: ["AAPL", "MSFT-001", "GOOGL"]
          business:
            forbiddenValues: ["", "null", "unknown"]
      
      name:
        type: string
        description: The legal name of the company.
        required: true
        index: true
        quality:
          format:
            pattern: "^[A-Z][a-zA-Z0-9\\s&.,-]+$"
            minLength: 2
            maxLength: 100
            caseFormat: "titleCase"
          business:
            forbiddenValues: ["Unknown Company", "N/A", "TBD", ""]
            requiredWords: []
          validation:
            uniquenessCheck: true
      classificationStandard:
        type: string
        description: Classification standard used for cross-entity alignment
        quality:
          business:
            allowedValues: ["GICS", "NAICS", "ISIC", "Internal"]
    
    quality:
      entityLevel:
        completeness:
          requiredPropertyRatio: 0.8
    
    relationships:
      CLASSIFIED_AS:
        target: Industry
        quality:
          relationshipLevel:
            cardinality:
              min: 1
              max: 3
        properties:
          description:
            type: string
            description: A human-readable description of this specific relationship instance.
          classificationSource:
            type: string
            description: The source or standard used for this classification (e.g., 'GICS', 'NAICS', 'Internal Analysis').
            required: true
            quality:
              business:
                allowedValues: ["GICS", "NAICS", "ISIC", "Internal", "Manual"]
      confidenceScore:
        type: number
        description: A score from 0.0 to 1.0 indicating confidence in this classification.
        quality:
          business:
            minValue: 0.0
            maxValue: 1.0
     
  Industry:
    properties:
      description:
        type: string
        description: A human-readable description of this entity.
        quality:
          format:
            minLength: 5
            maxLength: 200
          business:
            forbiddenValues: ["Unknown", "N/A"]
      
      industryId:
        type: string
        description: A unique identifier for the industry.
        unique: true
        quality:
          format:
            pattern: "^[A-Z0-9]{2,10}$"
      
      name:
        type: string
        description: The name of the industry.
        required: true
        index: true
        quality:
          format:
            minLength: 3
            maxLength: 50
          business:
            forbiddenValues: ["Unknown", "Other", "Misc"]
      
      classification:
        type: string
        description: Classification standard (e.g., 'GICS', 'ICB').
        quality:
          business:
            allowedValues: ["GICS", "ICB", "NAICS", "ISIC"]
      effectiveDate:
        type: string
        description: Date this classification became effective.
        quality:
          validation:
            dateWindow:
              earliest: "2018-01-01"
              latest: "2024-12-31"
              allowFuture: false
    
    relationships:
      PART_OF:
        target: Sector
        properties:
          description:
            type: string
            description: A human-readable description of this specific relationship instance.
          hierarchyStandard:
            type: string
            description: The standard defining this hierarchical relationship (e.g., 'GICS', 'Internal').
            required: true
            quality:
              business:
                allowedValues: ["GICS", "Internal", "Custom"]

# Global quality configuration
dataQualityConfig:
  extractionStandards:
    confidenceThresholds:
      entityExtraction: 0.7
      relationshipExtraction: 0.6
      propertyExtraction: 0.5
      
    completenessRequirements:
      minEntitiesPerDocument: 3
      requiredEntityTypes: ["Company"]
      
  distributionRules:
    entityBalance:
      maxSingleTypeRatio: 0.8
      expectedRatios:
        Company: {min: 0.2, max: 0.7}
        Industry: {min: 0.1, max: 0.4}
        
  crossValidationRules:
    - name: "company_industry_consistency"
      description: "Companies should be consistently classified across chunks"
      ruleType: "cross_chunk_consistency"
      entities: ["Company", "Industry"]
      relationships: ["CLASSIFIED_AS"]
    - name: "classification_alignment"
      description: "Company classification standards should align with industry classification"
      ruleType: "property_alignment"
      relationshipType: "CLASSIFIED_AS"
      sourceProperty: "classificationStandard"
      targetProperty: "classification"
      caseInsensitive: true
      severity: "error"
  coverageRules:
    - entityType: "Company"
      property: "description"
      minCoverage: 0.75
      severity: "warning"
  temporalRules:
    - entityType: "Industry"
      property: "effectiveDate"
      earliest: "2019-01-01"
      latest: "2024-12-31"
      allowFuture: false
      allowMissing: false
