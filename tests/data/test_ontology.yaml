version: "1.0"
entities:
  Person:
    properties:
      name:
        type: str
        required: true
      age:
        type: int
      email:
        type: str
    relationships:
      WORKS_IN:
        target: Department
        properties:
          role:
            type: str
          start_date:
            type: str

  Department:
    properties:
      name:
        type: str
        required: true
      location:
        type: str
      budget:
        type: float
    relationships:
      HAS_MANAGER:
        target: Person
        properties:
          since:
            type: str

sections:
  Organization:
    - Department
    - Person 