name: graphora-dev

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: graphora-api-dev:latest
    container_name: graphora-api
    command:
      - uv
      - run
      - graphora-server
      - serve
      - --host
      - 0.0.0.0
      - --port
      - ${API_PORT:-8000}
      - --reload
      - --log-level
      - ${UVICORN_LOG_LEVEL:-info}
    env_file:
      - .env
    environment:
      ONTOLOGY_DIR: /home/appuser/.graphora/ontologies
      UPLOAD_DIR: /home/appuser/.graphora/uploads
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: redis://redis:6379/0
      PREFECT_API_URL: http://prefect:${PREFECT_PORT:-4200}/api
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-graphora}:${POSTGRES_PASSWORD:-graphora}@postgres:5432/${POSTGRES_DB:-graphora}}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_API_KEY: ${CLERK_API_KEY}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE}
    volumes:
      - .:/app:delegated
      - uv-cache:/home/appuser/.cache/uv
      - uv-venv:/opt/graphora/.venv
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j-staging:
        condition: service_healthy
      neo4j-prod:
        condition: service_healthy
      prefect:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    image: graphora-migrate:latest
    container_name: graphora-db-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-graphora}:${POSTGRES_PASSWORD:-graphora}@postgres:5432/${POSTGRES_DB:-graphora}}
    volumes:
      - .:/app:delegated
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: graphora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphora}
      POSTGRES_USER: ${POSTGRES_USER:-graphora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_SOURCE:-./.docker-data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-graphora} -d ${POSTGRES_DB:-graphora}
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: graphora-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${REDIS_DATA_SOURCE:-./.docker-data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-staging:
    image: neo4j:5.20
    container_name: graphora-neo4j-staging
    env_file:
      - .env
    environment:
      NEO4J_AUTH: ${NEO4J_STAGING_USER:-neo4j}/${NEO4J_STAGING_PASSWORD:-staging_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    ports:
      - "${NEO4J_STAGING_HTTP_PORT:-7474}:7474"
      - "${NEO4J_STAGING_BOLT_PORT:-7687}:7687"
    volumes:
      - ${NEO4J_STAGING_DATA_SOURCE:-./.docker-data/neo4j-staging/data}:/data
      - ${NEO4J_STAGING_LOG_SOURCE:-./.docker-data/neo4j-staging/logs}:/logs
      - ${NEO4J_STAGING_IMPORT_SOURCE:-./.docker-data/neo4j-staging/import}:/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_STAGING_USER:-neo4j} -p ${NEO4J_STAGING_PASSWORD:-staging_password} 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 10

  neo4j-prod:
    image: neo4j:5.20
    container_name: graphora-neo4j-prod
    env_file:
      - .env
    environment:
      NEO4J_AUTH: ${NEO4J_PROD_USER:-neo4j}/${NEO4J_PROD_PASSWORD:-prod_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    ports:
      - "${NEO4J_PROD_HTTP_PORT:-8474}:7474"
      - "${NEO4J_PROD_BOLT_PORT:-8687}:7687"
    volumes:
      - ${NEO4J_PROD_DATA_SOURCE:-./.docker-data/neo4j-prod/data}:/data
      - ${NEO4J_PROD_LOG_SOURCE:-./.docker-data/neo4j-prod/logs}:/logs
      - ${NEO4J_PROD_IMPORT_SOURCE:-./.docker-data/neo4j-prod/import}:/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_PROD_USER:-neo4j} -p ${NEO4J_PROD_PASSWORD:-prod_password} 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 10

  prefect:
    image: prefecthq/prefect:3.2.7-python3.11
    container_name: graphora-prefect
    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0
      - --port
      - ${PREFECT_PORT:-4200}
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://0.0.0.0:${PREFECT_PORT:-4200}/api
    ports:
      - "${PREFECT_PORT:-4200}:${PREFECT_PORT:-4200}"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:${PREFECT_PORT:-4200}/api/health")'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  redis-data:
  postgres-data:
  neo4j-staging-data:
  neo4j-staging-logs:
  neo4j-staging-import:
  neo4j-prod-data:
  neo4j-prod-logs:
  neo4j-prod-import:
  uv-cache:
  uv-venv:
