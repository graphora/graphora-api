version: "0.1.0"
entities:
  Person:
    description: A named human individual mentioned in the text.
    properties:
      name:
        type: str
        required: true
        unique: true
        description: |
          Full name as it appears in the text. ``unique: true`` makes
          this the sole input to ``_generate_node_key`` —
          ``canonical_key`` becomes ``Person:name=<lowercased name>``
          regardless of which optional properties were extracted. Without
          this flag the key would include every non-empty property,
          which makes the canonical_id unstable across extractions that
          surface different optional fields.
      title:
        type: str
        required: false
        description: Job title or role.
  Organization:
    description: A company, institution, or other named organization.
    properties:
      name:
        type: str
        required: true
        unique: true
        description: |
          Organization name. Same ``unique: true`` rationale as
          Person.name above — pins the canonical_key derivation to a
          single stable property.
relationships:
  WORKS_AT:
    source: Person
    target: Organization
    description: Employment or affiliation relationship.
    properties:
      start_date:
        type: str
        required: false
        description: When the person started working at the organization.
