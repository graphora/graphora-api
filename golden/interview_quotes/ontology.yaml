version: "0.1.0"
entities:
  Speaker:
    description: An interview speaker.
    properties:
      name:
        type: str
        required: true
        unique: true
  Topic:
    description: A topic discussed.
    properties:
      name:
        type: str
        required: true
        unique: true
  Publication:
    description: A publication.
    properties:
      name:
        type: str
        required: true
        unique: true
relationships:
  DISCUSSED:
    source: Speaker
    target: Topic
    description: The Speaker discussed this Topic.
    properties: {}
  INTERVIEWED_BY:
    source: Speaker
    target: Publication
    description: The Speaker was interviewed by this Publication.
    properties: {}
